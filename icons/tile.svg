<!--
  fullpage-shot tile, detailed variant. Rasterised to tile128 and tile48.

  This set backs the manifest "icons" key: chrome://extensions, the puzzle
  menu, permission dialogs. Those all sit on the browser's own card, where a
  self-grounding mark is right. The toolbar button uses glyph.svg instead,
  which is line art on a transparent ground.

  The idea has to survive being 16 pixels wide, so it is built from three
  shapes and nothing else: a dark rounded square so the glyph reads on both a
  light and a dark toolbar, a light page that runs off the top and bottom edges
  because the whole point is that the page is longer than the frame, and one
  bold arrow saying which way the capture goes.

  Text lines sit only in the top and bottom thirds. The arrow needs clean paper
  behind it or the middle of the icon turns to mud at small sizes; that muddle
  is what was wrong with the first icon, which had a thin band, two small
  arrows, and text lines all fighting over the same forty pixels.

  See tile-small.svg for the 32 and 16 variant, which drops the text entirely.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <clipPath id="frame">
      <rect x="0" y="0" width="128" height="128" rx="26" ry="26" />
    </clipPath>
  </defs>

  <rect x="0" y="0" width="128" height="128" rx="26" ry="26" fill="#171B2B" />

  <g clip-path="url(#frame)">
    <!-- Bleeds past both edges: a page with no visible top or bottom. -->
    <rect x="32" y="-8" width="64" height="144" rx="5" ry="5" fill="#F4F6FB" />

    <g fill="#C6CEDD">
      <rect x="42" y="10" width="44" height="5" rx="2.5" />
      <rect x="42" y="21" width="33" height="5" rx="2.5" />
      <rect x="42" y="32" width="44" height="5" rx="2.5" />

      <rect x="42" y="97" width="44" height="5" rx="2.5" />
      <rect x="42" y="108" width="29" height="5" rx="2.5" />
    </g>

    <g fill="#4C8DFF">
      <rect x="58" y="44" width="12" height="24" />
      <path d="M46 62 H82 L64 90 Z" />
    </g>
  </g>
</svg>
